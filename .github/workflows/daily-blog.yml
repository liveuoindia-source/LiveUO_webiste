name: Daily pharCare blog post

# Publishes one article from content/blog/posts/ each morning, commits the
# generated pages, and notifies search engines.
#
# Times are UTC. 01:30 UTC = 07:00 IST, so the post is live before the
# working day starts in India.
on:
  schedule:
    - cron: "30 1 * * *"
  pull_request:
    paths:
      - "content/blog/**"
      - "scripts/**"
      - "assets/blog.css"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would publish without committing"
        type: boolean
        default: false
      date:
        description: "Publish date override (YYYY-MM-DD), for backfills"
        type: string
        required: false

concurrency:
  # Never let two runs publish on the same day or race on the same commit.
  group: daily-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install: the blog scripts use only the Node standard library,
      # so the daily job cannot be broken by a dependency change.
      - name: Validate the post bank
        run: node scripts/check-blog.js

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: node scripts/publish-daily-post.js --dry-run

      - name: Publish today's post
        id: publish
        if: ${{ !inputs.dry_run }}
        run: |
          set +e
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/publish-daily-post.js --date="${{ inputs.date }}"
          else
            node scripts/publish-daily-post.js
          fi
          status=$?
          set -e
          # 3 = bank empty, 4 = already published today. Neither is a failure,
          # but both should be visible rather than silently succeeding.
          if [ $status -eq 3 ]; then
            echo "::warning::Post bank is empty - add articles to content/blog/posts/"
            echo "outcome=empty" >> "$GITHUB_OUTPUT"
          elif [ $status -eq 4 ]; then
            echo "::notice::A post was already published today - nothing to do."
            echo "outcome=already" >> "$GITHUB_OUTPUT"
          elif [ $status -ne 0 ]; then
            exit $status
          else
            echo "outcome=published" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: ${{ steps.publish.outputs.outcome == 'published' }}
        run: |
          git config user.name "liveuo-blog-bot"
          git config user.email "info@liveuo.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "blog: publish ${{ steps.publish.outputs.slug }}" \
                     -m "${{ steps.publish.outputs.title }}" \
                     -m "${{ steps.publish.outputs.url }}"
          # Another run (or a human) may have pushed since checkout.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # Committing to main does NOT make a post visible. The IIS host serves
      # its own clone, which only updates when Plesk is told to pull. Without
      # this step the post sits in main unseen - that is how five days of posts
      # (3-7 Sep 2026) were live in git while every URL 404ed on the site.
      - name: Deploy to Plesk
        if: ${{ steps.publish.outputs.outcome == 'published' }}
        env:
          PLESK_DEPLOY_WEBHOOK: ${{ secrets.PLESK_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$PLESK_DEPLOY_WEBHOOK" ]; then
            echo "::error::PLESK_DEPLOY_WEBHOOK is not set. The post is committed but will never reach the site."
            exit 1
          fi
          # A body is required, not optional: Plesk's web-hook.php answers
          # 411 Length Required to a bodyless POST, so `-X POST` alone never
          # triggers a deploy. Verified against the live endpoint - `-d '{}'`
          # returns 204. GitHub's own webhooks work because they always post
          # a JSON payload.
          code=$(curl -sS -o deploy-response.txt -w "%{http_code}" \
                      --retry 3 --retry-delay 10 --retry-all-errors \
                      --max-time 120 \
                      -X POST -H "Content-Type: application/json" -d '{}' \
                      "$PLESK_DEPLOY_WEBHOOK")
          echo "Plesk webhook responded: $code"
          head -c 500 deploy-response.txt || true
          rm -f deploy-response.txt
          case "$code" in
            2*) echo "Deploy requested." ;;
            *)  echo "::error::Plesk deploy webhook returned $code"; exit 1 ;;
          esac

      # A 2xx only means Plesk ACCEPTED the request - the pull runs
      # asynchronously and can still fail. Polling the real URL is what turns a
      # silent deploy failure into a red build today, rather than a 404 someone
      # notices in Search Console weeks later.
      - name: Wait for the post to be live
        if: ${{ steps.publish.outputs.outcome == 'published' }}
        run: |
          url="${{ steps.publish.outputs.url }}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo 000)
            echo "attempt $i/20: HTTP $code  $url"
            if [ "$code" = "200" ]; then
              echo "Live after $i attempt(s)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$url did not return 200 within ~5 minutes - deploy likely failed."
          exit 1

      # Deliberately AFTER the deploy and the liveness check. Submitting a URL
      # that 404s asks Google to crawl a missing page, which is a negative
      # quality signal. A failure above skips this step: GitHub applies an
      # implicit success() to any `if` that has no status-check function.
      - name: Notify search engines
        if: ${{ steps.publish.outputs.outcome == 'published' }}
        env:
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/ping-indexers.js

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily blog run"
            echo ""
            echo "- Outcome: \`${{ steps.publish.outputs.outcome || 'dry-run' }}\`"
            if [ -n "${{ steps.publish.outputs.url }}" ]; then
              echo "- Published: [${{ steps.publish.outputs.title }}](${{ steps.publish.outputs.url }})"
              # Re-checked here rather than reusing the wait step's result, so
              # the summary reports what is actually serving right now even when
              # an earlier step failed and this one still runs under always().
              live=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                     "${{ steps.publish.outputs.url }}" || echo 000)
              echo "- Live on site: \`HTTP $live\`"
              if [ "$live" != "200" ]; then
                echo "- :warning: The post is in git but NOT on the site. Check the Plesk deploy."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs on every PR touching the blog, so a broken post is caught before merge.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-blog.js
      - run: node scripts/build.js --check
